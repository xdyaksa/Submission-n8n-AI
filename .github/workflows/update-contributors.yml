name: Update Contributors List

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributors:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run update contributors script
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 .github/scripts/update_contributors.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update CONTRIBUTORS.md [skip ci]"
            git push origin main
          fi
